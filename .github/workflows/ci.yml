name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: roundtable
          POSTGRES_USER: roundtable
          POSTGRES_PASSWORD: roundtable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roundtable -d roundtable"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://roundtable:roundtable@127.0.0.1:5432/roundtable
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Django checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest -q

  ios:
    name: iOS
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test RoundtableCore
        working-directory: ios/RoundtableCore
        run: swift test
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app for simulator
        run: |
          xcodebuild \
            -project AgentRoundtable.xcodeproj \
            -scheme AgentRoundtable \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
