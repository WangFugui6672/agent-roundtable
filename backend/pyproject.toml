[project]
name = "agent-roundtable-backend"
version = "0.1.0"
description = "Django backend for Agent Roundtable"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "channels>=4.2,<5",
    "psycopg[binary]>=3.2,<4",
    "daphne>=4.2,<5",
    "channels-redis>=4.2,<5",
    "redis>=5,<8",
    "celery[redis]>=5.4,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "roundtable.settings"
pythonpath = ["."]
testpaths = ["apps"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["roundtable", "apps"]
