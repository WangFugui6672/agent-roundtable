name: AgentRoundtable
options:
  bundleIdPrefix: com.wangfugui
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  RoundtableCore:
    path: RoundtableCore

targets:
  AgentRoundtable:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AgentRoundtable
    dependencies:
      - package: RoundtableCore
        product: RoundtableCore
    info:
      path: AgentRoundtable/Info.plist
      properties:
        CFBundleDisplayName: 圆桌
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
        RTAPIBaseURL: http://localhost:8000
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wangfugui.agentroundtable
        PRODUCT_NAME: AgentRoundtable
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  AgentRoundtableUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AgentRoundtableUITests
    dependencies:
      - target: AgentRoundtable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wangfugui.agentroundtable.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: AgentRoundtable

schemes:
  AgentRoundtable:
    build:
      targets:
        AgentRoundtable: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentRoundtableUITests
    archive:
      config: Release
